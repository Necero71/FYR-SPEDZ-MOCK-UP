<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYR_SPEEDZ | Auto Electrical & Diagnostics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --surface-dark: #121212;
            --fyr-red: #d30000;
            --fyr-red-hover: #ff1a1a;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #222222;
            --wa-green: #25D366;
            --yt-red: #FF0000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.5;
            overflow-x: hidden; 
        }

        /* Scroll Progress Bar */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background-color: var(--fyr-red);
            width: 0%;
            z-index: 1000;
            box-shadow: 0 0 10px rgba(211, 0, 0, 0.8);
            transition: width 0.1s ease-out;
        }

        /* Sticky Glass Header */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            text-align: center;
            padding-top: 1.5rem;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid transparent;
            background-color: var(--bg-dark);
            transition: all 0.3s ease;
        }

        header.scrolled {
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
            background-color: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 2px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: 11vw; 
            line-height: 1.1;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            transition: font-size 0.3s ease;
        }

        header.scrolled .logo {
            font-size: 8vw; 
            margin-bottom: 0;
        }

        .logo span { color: var(--fyr-red); }

        .tagline {
            color: var(--fyr-red);
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: opacity 0.3s ease, height 0.3s ease;
        }

        header.scrolled .tagline {
            opacity: 0; 
            height: 0;
            overflow: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1rem 1.5rem 1rem;
        }

        .intro-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 3rem;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
        }

        section { margin-bottom: 3rem; }

        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            font-style: italic;
            margin-bottom: 1.25rem;
            text-transform: uppercase;
            text-align: center;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem; 
        }

        .service-card {
            position: relative;
            background-size: cover;
            background-position: center;
            background-color: #1a1a1a;
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--fyr-red);
            padding: 1.25rem 0.75rem; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            color: inherit; 
            cursor: pointer;
            height: 110px; 
            overflow: hidden;
            border-radius: 4px;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none; /* Removed default outline for custom focus */
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0.95) 100%);
            z-index: 1;
            transition: background 0.25s ease;
        }

        /* UX: Hover State */
        .service-card:hover {
            transform: translateY(-3px) scale(1.02); 
            border-color: var(--fyr-red);
            box-shadow: 0 5px 15px rgba(211,0,0,0.2);
        }

        /* UX: Tactile Tap Feedback */
        .service-card:active {
            transform: scale(0.96); 
        }

        /* UX: Keyboard Accessibility */
        .service-card:focus-visible {
            border-color: var(--fyr-red);
            box-shadow: 0 0 0 3px rgba(211,0,0,0.5);
        }

        .service-card:hover::before {
            background: linear-gradient(180deg, rgba(5,5,5,0.1) 0%, rgba(5,5,5,0.85) 100%);
        }

        .service-content {
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        .service-title {
            font-weight: 700;
            font-size: 0.95rem; 
            line-height: 1.2;
            text-transform: uppercase;
            margin-bottom: 0.15rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .service-sub {
            color: var(--fyr-red);
            font-size: 0.75rem; 
            font-weight: 600;
            text-transform: uppercase;
            line-height: 1.2;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* MODAL STYLES */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-box {
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--fyr-red);
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            padding: 2.5rem 1.5rem 2rem 1.5rem; /* Increased top padding to avoid close button overlap */
            position: relative;
            transform: translateY(20px) scale(0.95);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .modal-overlay.active .modal-box { transform: translateY(0) scale(1); }

        /* UX: Fat-finger optimized close button */
        .close-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            font-size: 1.75rem;
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0.5rem; /* Much easier to tap */
            line-height: 1;
            transition: color 0.2s ease;
        }

        .close-btn:hover, .close-btn:focus-visible { 
            color: var(--fyr-red); 
            outline: none;
        }

        #modal-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-style: italic;
            font-size: 1.4rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        #modal-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        #modal-wa-btn { display: block; width: 100%; text-align: center; }

        /* CTA & CONTACT SECTION */
        .cta-section {
            text-align: center;
            background: linear-gradient(180deg, var(--bg-dark) 0%, #1a0000 100%);
            padding: 2.5rem 1rem;
            border: 1px solid var(--fyr-red);
            border-radius: 8px;
            margin-bottom: 5rem; /* Give space for FAB */
        }

        .book-now {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: 2rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .contact-info {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .contact-btn {
            display: inline-block;
            background-color: rgba(211, 0, 0, 0.1);
            color: var(--text-main);
            text-decoration: none;
            padding: 0.85rem;
            border-radius: 6px;
            border: 1px solid rgba(211, 0, 0, 0.3);
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .contact-btn:hover {
            background-color: rgba(211, 0, 0, 0.2);
            border-color: var(--fyr-red-hover);
        }

        /* UX: Tactile tap on buttons */
        .contact-btn:active { transform: scale(0.97); }

        .wa-btn { background-color: var(--wa-green); color: #000; border: none; }
        .wa-btn:hover { background-color: #1ebe5d; border: none; }
        .yt-btn { background-color: var(--yt-red); color: #ffffff; border: none; }
        .yt-btn:hover { background-color: #cc0000; border: none; }

        /* UX: Floating Action Button */
        .fab-wa {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--wa-green);
            color: #000;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            z-index: 99;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .fab-wa:hover { 
            transform: scale(1.05) translateY(-3px); 
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
            background-color: #1ebe5d;
        }
        
        .fab-wa:active { transform: scale(0.95); }

        .location {
            margin-top: 1.5rem;
            color: var(--fyr-red);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
